name: Free AI Code Efficiency Reviewer

on: 
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests
      
      - name: Extract PR Diff
        run: |
          git fetch origin ${{ github.base_ref}}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Analyze Efficiency via Google AI Studio Gemini
        env: 
          FREE_AI_API_KEY: ${{ secrets.FREE_AI_API_KEY }}
        run: |
          python -c "
          import os, requests, json, time

          api_key = os.getenv('FREE_AI_API_KEY')
          if not api_key:
              print('Error: FREE_AI_API_KEY secret is missing!')
              exit(1)

          try:
              with open('pr_diff.txt', 'r') as f:
                  diff_content = f.read()[:12000] # Stay safely inside free token limits
          except FileNotFoundError:
              diff_content = 'No diff found.'

          system_prompt = (
              'You are an expert software engineer specializing in performance, efficiency, and resource optimization. '
              'Analyze the following Git diff. Ignore style or syntax unless it hurts performance. '
              'Focus entirely on finding algorithmic complexity bugs (Big O issues), heavy database/API loops, memory leaks, '
              'or missing caching opportunities. Provide a highly concise markdown summary with concrete suggestions.'
          )

          headers = {'Content-Type': 'application/json'}
          payload = {
              'system_instruction': {'parts': [{'text': system_prompt}]},
              'contents': [{'parts': [{'text': f'Review this diff:\n\n{diff_content}'}]}],
              'generationConfig': {'temperature': 0.2}
          }

          models = ['gemini-1.5-flash', 'gemini-2.0-flash-lite', 'gemini-2.0-flash']
          response = None
          
          for model in models:
              url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}'
              for attempt in range(3):
                  print(f'Calling {model} (Attempt {attempt + 1})...')
                  response = requests.post(url, headers=headers, json=payload)
                  if response.status_code == 200:
                      break
                  elif response.status_code == 429:
                      print(f'429 Rate limited on {model}, retrying in {(attempt + 1) * 5}s...')
                      time.sleep((attempt + 1) * 5)
                  else:
                      break
              if response and response.status_code == 200:
                  break
          
          if not response or response.status_code != 200:
              err_msg = response.text if response else 'No response'
              print(f'API Error: {err_msg}')
              with open('review.md', 'w') as out:
                  out.write(f'⚠️ AI Reviewer encountered an API error (Rate limit / Quota exceeded): {response.status_code if response else "Error"}\n\n```\n{err_msg}\n```\n\n*Tip: If using Google AI Studio Free Tier, wait 1 minute for rate limits to reset.*')
              exit(0)

          review_text = response.json()['candidates'][0]['content']['parts'][0]['text']
          
          with open('review.md', 'w') as out:
              out.write('### ⚡ AI Code Efficiency Report\n\n' + review_text)
          "

      - name: Post PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: 'review.md'
          