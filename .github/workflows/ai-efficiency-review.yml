name: Free AI Code Efficiency Reviewer

on: 
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  packages: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract PR Diff
        run: |
          git fetch origin ${{ github.base_ref}}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Analyze Efficiency via Groq API
        env: 
          FREE_AI_API_KEY: ${{ secrets.FREE_AI_API_KEY }}
        run: node .github/scripts/ai_review.cjs

      - name: Build Application in Docker
        run: |
          echo -e "\n\n---\n" >> review.md
          if docker build -t oidc-server:latest . > docker_build.log 2>&1; then
            echo "### 🐳 Docker Build Status" >> review.md
            echo "✅ **Success:** Application built successfully in Docker." >> review.md
          else
            echo "### 🐳 Docker Build Status" >> review.md
            echo "❌ **Failed:** Docker build encountered errors:" >> review.md
            echo '```' >> review.md
            tail -n 30 docker_build.log >> review.md
            echo '```' >> review.md
            exit 1
          fi

      - name: Save Docker Image to File
        run: |
          docker save -o oidc-server.tar oidc-server:latest

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-oidc-server
          path: oidc-server.tar
          retention-days: 7

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/oidc-server
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          
          docker tag oidc-server:latest $IMAGE_ID:$VERSION
          docker tag oidc-server:latest $IMAGE_ID:latest
          
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest
          
          echo -e "\n📦 **GHCR Package:** \`$IMAGE_ID:$VERSION\`" >> review.md

      - name: Post PR Comment
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: 'review.md'
          