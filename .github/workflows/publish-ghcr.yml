name: Publish Docker Image to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  publish-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          no-cache: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oidc-poc:${{ github.sha }}

      - name: Trigger Render Deploy & Wait
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/oidc-poc:${{ github.sha }}"

          if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Triggering Render deployment for specific image tag: $IMAGE_TAG via Render API..."
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              --data "{\"imageUrl\": \"docker.io/$IMAGE_TAG\"}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")
          else
            echo "WARNING: RENDER_API_KEY or RENDER_SERVICE_ID is not set. Render Deploy Hook URL only pulls the configured default tag (:latest)."
            echo "Triggering deploy via hook URL..."
            response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          fi

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "Failed to trigger deploy. HTTP Status: $http_code"
            echo "Response: $body"
            exit 1
          fi

          deploy_id=$(echo "$body" | grep -o '"id":"[^"]*' | head -n1 | cut -d'"' -f4)
          echo "Deploy triggered successfully. Deploy ID: $deploy_id"

          # Poll deploy status using Render API until it succeeds or fails
          if [ -n "$deploy_id" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Waiting for deployment to complete..."
            while true; do
              sleep 10
              status_res=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id")
              status=$(echo "$status_res" | grep -o '"status":"[^"]*' | head -n1 | cut -d'"' -f4)
              echo "Current status: $status"
              if [ "$status" = "live" ]; then
                echo "Deployment succeeded!"
                break
              elif [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
                echo "Deployment failed with status: $status"
                exit 1
              fi
            done
          fi
